  <!-- Left Cute Paw -->
  <path d="M 44 78 C 44 73.5 51 73.5 51 78 Z" fill="#FFFFFF" stroke="#EC4899" stroke-width="1.8" stroke-linejoin="round" />
  <path d="M 46.5 76 L 46.5 78 M 48.5 76 L 48.5 78" stroke="#FDA4AF" stroke-width="1.3" stroke-linecap="round" />
  <!-- Right Cute Paw -->
  <path d="M 69 78 C 69 73.5 76 73.5 76 78 Z" fill="#FFFFFF" stroke="#EC4899" stroke-width="1.8" stroke-linejoin="round" />
  <path d="M 71.5 76 L 71.5 78 M 73.5 76 L 73.5 78" stroke="#FDA4AF" stroke-width="1.3" stroke-linecap="round" />

  <!-- Happy Graceful Swishing Tail -->
  <path d="M 91 90 C 99 87 106 76 102 62 C 99 55 93 55 92 61" fill="none" stroke="url(#ayaRoseGold)" stroke-width="4.5" stroke-linecap="round" />
</svg>
