<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ayaRoseGold" x1="10" y1="10" x2="110" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EC4899" />
      <stop offset="50%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#FB923C" />
    </linearGradient>
    <linearGradient id="ayaGlow" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FFF1F5" />
    </linearGradient>
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#EC4899" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Outer Ring Badge -->
  <circle cx="60" cy="60" r="54" fill="url(#ayaGlow)" stroke="url(#ayaRoseGold)" stroke-width="3.5" filter="url(#softShadow)" />
  <circle cx="60" cy="60" r="48" fill="none" stroke="#FDA4AF" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.6" />

  <!-- Sparkles -->
  <path d="M 24 30 Q 25.5 25 27 30 Q 32 31.5 27 33 Q 25.5 38 24 33 Q 19 31.5 24 30 Z" fill="#F59E0B" />
  <path d="M 99 44 Q 100.5 39 102 44 Q 107 45.5 102 47 Q 100.5 52 99 47 Q 94 45.5 99 44 Z" fill="#F59E0B" />

  <!-- Cute Cat Ears -->
  <path d="M 38 42 L 31 19 C 33 17 38 18 42 22 L 51 34 Z" fill="url(#ayaRoseGold)" />
  <path d="M 82 42 L 89 19 C 87 17 82 18 78 22 L 69 34 Z" fill="url(#ayaRoseGold)" />
  <!-- Inner Ears (Cute Pink) -->
  <path d="M 37 38 L 33 24 C 34 23 37 24 39 26 L 47 34 Z" fill="#FFE4E6" />
  <path d="M 83 38 L 87 24 C 86 23 83 24 81 26 L 73 34 Z" fill="#FFE4E6" />

  <!-- Monogram A Arch (Cat Head & Body Legs) -->
  <path d="M 29 90 C 33 68 46 35 60 33 C 74 35 87 68 91 90" fill="none" stroke="url(#ayaRoseGold)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Smiling Crescent Eyes (Happy Laughing Expression ^ ^) -->
  <path d="M 42 54 Q 49 45 56 54" fill="none" stroke="#831843" stroke-width="3.5" stroke-linecap="round" />
  <path d="M 41 52 L 37 49" stroke="#831843" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 64 54 Q 71 45 78 54" fill="none" stroke="#831843" stroke-width="3.5" stroke-linecap="round" />
  <path d="M 79 52 L 83 49" stroke="#831843" stroke-width="2.5" stroke-linecap="round" />

  <!-- Rosy Blushing Cheeks -->
  <ellipse cx="38" cy="62" rx="6.5" ry="4" fill="#FB7185" opacity="0.65" />
  <ellipse cx="82" cy="62" rx="6.5" ry="4" fill="#FB7185" opacity="0.65" />
  <circle cx="37" cy="61" r="1.2" fill="#FFFFFF" />
  <circle cx="83" cy="61" r="1.2" fill="#FFFFFF" />

  <!-- Playful Whiskers -->
  <path d="M 33 58 Q 23 57 17 59" fill="none" stroke="#FDA4AF" stroke-width="2" stroke-linecap="round" />
  <path d="M 32 63 Q 23 65 18 68" fill="none" stroke="#FDA4AF" stroke-width="2" stroke-linecap="round" />
  <path d="M 87 58 Q 97 57 103 59" fill="none" stroke="#FDA4AF" stroke-width="2" stroke-linecap="round" />
  <path d="M 88 63 Q 97 65 102 68" fill="none" stroke="#FDA4AF" stroke-width="2" stroke-linecap="round" />

  <!-- Tiny Cute Nose -->
  <path d="M 57 59 C 57 57.8 63 57.8 63 59 C 63 60.5 60.5 63 60 63.3 C 59.5 63 57 60.5 57 59 Z" fill="#E11D48" />

  <!-- Cheerful Open Laughing Smile (بيضحك من قلبه) -->
  <path d="M 52 65 Q 56 68 60 66 Q 64 68 68 65" fill="none" stroke="#9F1239" stroke-width="2.4" stroke-linecap="round" />
  <!-- Mouth Cavity -->
  <path d="M 53 66 Q 60 79 67 66 Z" fill="#881337" />
  <!-- Cute Pink Tongue -->
  <path d="M 55 71.5 Q 60 78.5 65 71.5 Q 60 73.5 55 71.5 Z" fill="#FB7185" />

  <!-- 'A' Crossbar with Cute Paws -->
